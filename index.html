<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tuki</title>
<meta name="description" content="Tuki — личная страничка" />
<meta name="theme-color" content="#141218" />
<link rel="icon" type="image/jpeg" href="assets/avatar.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&icon_names=auto_awesome,bedtime,celebration,chevron_left,chevron_right,close,contrast,dark_mode,favorite,light_mode,palette,pets,shuffle,touch_app,wb_sunny,wb_twilight&display=block" rel="stylesheet" />
<script>
  // ставим тему и закэшированную палитру до первой отрисовки, чтобы не мигало
  (function () {
    try {
      var mode = localStorage.getItem('tuki-mode') || 'auto';
      var dark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      var root = document.documentElement;
      root.dataset.theme = dark ? 'dark' : 'light';
      var cache = JSON.parse(localStorage.getItem('tuki-tokens') || 'null');
      var tokens = cache && cache[dark ? 'dark' : 'light'];
      if (tokens) for (var k in tokens) root.style.setProperty(k, tokens[k]);
    } catch (e) {}
  })();
</script>
<style>
  /* ---------- токены Material 3 (фолбэк, пока не посчитана динамическая палитра) ---------- */
  :root {
    color-scheme: light;
    --md-primary: #6750a4;
    --md-on-primary: #ffffff;
    --md-primary-container: #eaddff;
    --md-on-primary-container: #4f378b;
    --md-secondary: #625b71;
    --md-on-secondary: #ffffff;
    --md-secondary-container: #e8def8;
    --md-on-secondary-container: #4a4458;
    --md-tertiary: #7d5260;
    --md-on-tertiary: #ffffff;
    --md-tertiary-container: #ffd8e4;
    --md-on-tertiary-container: #633b48;
    --md-surface: #fef7ff;
    --md-on-surface: #1d1b20;
    --md-on-surface-variant: #49454f;
    --md-outline: #79747e;
    --md-outline-variant: #cac4d0;
    --md-surface-container-lowest: #ffffff;
    --md-surface-container-low: #f7f2fa;
    --md-surface-container: #f3edf7;
    --md-surface-container-high: #ece6f0;
    --md-surface-container-highest: #e6e0e9;
    --md-inverse-surface: #322f35;
    --md-inverse-on-surface: #f5eff7;
    --md-inverse-primary: #d0bcff;

    /* пружины M3 Expressive; JS заменит их на настоящие linear()-пружины */
    --ease-fast: cubic-bezier(.34, 1.56, .64, 1);
    --ease-default: cubic-bezier(.3, 1.35, .5, 1);
    --ease-slow: cubic-bezier(.3, 1.2, .5, 1);
    --ease-effects: cubic-bezier(.2, 0, 0, 1);
    --dur-fast: 350ms;
    --dur-default: 550ms;
    --dur-slow: 800ms;
    --dur-effects: 250ms;

    --font: 'Roboto Flex', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --md-primary: #d0bcff;
      --md-on-primary: #381e72;
      --md-primary-container: #4f378b;
      --md-on-primary-container: #eaddff;
      --md-secondary: #ccc2dc;
      --md-on-secondary: #332d41;
      --md-secondary-container: #4a4458;
      --md-on-secondary-container: #e8def8;
      --md-tertiary: #efb8c8;
      --md-on-tertiary: #492532;
      --md-tertiary-container: #633b48;
      --md-on-tertiary-container: #ffd8e4;
      --md-surface: #141218;
      --md-on-surface: #e6e0e9;
      --md-on-surface-variant: #cac4d0;
      --md-outline: #938f99;
      --md-outline-variant: #49454f;
      --md-surface-container-lowest: #0f0d13;
      --md-surface-container-low: #1d1b20;
      --md-surface-container: #211f26;
      --md-surface-container-high: #2b2930;
      --md-surface-container-highest: #36343b;
      --md-inverse-surface: #e6e0e9;
      --md-inverse-on-surface: #322f35;
      --md-inverse-primary: #6750a4;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --md-primary: #d0bcff;
    --md-on-primary: #381e72;
    --md-primary-container: #4f378b;
    --md-on-primary-container: #eaddff;
    --md-secondary: #ccc2dc;
    --md-on-secondary: #332d41;
    --md-secondary-container: #4a4458;
    --md-on-secondary-container: #e8def8;
    --md-tertiary: #efb8c8;
    --md-on-tertiary: #492532;
    --md-tertiary-container: #633b48;
    --md-on-tertiary-container: #ffd8e4;
    --md-surface: #141218;
    --md-on-surface: #e6e0e9;
    --md-on-surface-variant: #cac4d0;
    --md-outline: #938f99;
    --md-outline-variant: #49454f;
    --md-surface-container-lowest: #0f0d13;
    --md-surface-container-low: #1d1b20;
    --md-surface-container: #211f26;
    --md-surface-container-high: #2b2930;
    --md-surface-container-highest: #36343b;
    --md-inverse-surface: #e6e0e9;
    --md-inverse-on-surface: #322f35;
    --md-inverse-primary: #6750a4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--font);
    background: var(--md-surface);
    color: var(--md-on-surface);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background-color .5s, color .5s;
  }

  .material-symbols-rounded {
    font-family: 'Material Symbols Rounded';
    font-weight: normal;
    font-style: normal;
    font-size: 24px;
    line-height: 1;
    display: inline-block;
    white-space: nowrap;
    direction: ltr;
    font-variation-settings: 'FILL' 1, 'wght' 500, 'opsz' 24;
    user-select: none;
  }

  :focus-visible {
    outline: 3px solid var(--md-secondary);
    outline-offset: 3px;
  }

  /* ---------- фон: живые фигуры M3 ---------- */
  .bg-shapes {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .bg-shape {
    position: absolute;
    transform: translate(calc(var(--px, 0) * var(--depth) * 1px), calc(var(--py, 0) * var(--depth) * 1px));
    transition: transform 1.2s var(--ease-slow);
  }
  .bg-shape > div {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    opacity: .55;
    animation: spin var(--spin, 40s) linear infinite;
    transition: clip-path 1.6s var(--ease-slow), background-color .5s;
  }
  .bg-shape.s1 { --depth: 18; width: 52vmin; height: 52vmin; top: -14vmin; left: -12vmin; }
  .bg-shape.s1 > div { background: var(--md-primary-container); --spin: 60s; }
  .bg-shape.s2 { --depth: -26; width: 40vmin; height: 40vmin; bottom: -10vmin; right: -8vmin; }
  .bg-shape.s2 > div { background: var(--md-tertiary-container); --spin: 45s; animation-direction: reverse; }
  .bg-shape.s3 { --depth: 34; width: 22vmin; height: 22vmin; top: 18vh; right: 8vw; }
  .bg-shape.s3 > div { background: var(--md-secondary-container); --spin: 30s; }
  .bg-shape.s4 { --depth: -40; width: 14vmin; height: 14vmin; bottom: 22vh; left: 7vw; }
  .bg-shape.s4 > div { background: var(--md-tertiary-container); --spin: 25s; animation-direction: reverse; }
  .bg-shape.s5 { --depth: 50; width: 9vmin; height: 9vmin; top: 8vh; left: 46vw; }
  .bg-shape.s5 > div { background: var(--md-primary-container); --spin: 18s; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- контент ---------- */
  .wrap {
    position: relative;
    z-index: 2;
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 16px 120px;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  /* чип приветствия */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 16px 0 10px;
    border-radius: 16px;
    background: var(--md-surface-container-high);
    color: var(--md-on-surface-variant);
    font-size: .875rem;
    font-weight: 500;
    font-variation-settings: 'wdth' 110;
    margin-bottom: 28px;
    animation: rise var(--dur-slow) var(--ease-default) backwards;
  }
  .chip .material-symbols-rounded { font-size: 18px; color: var(--md-tertiary); }

  /* ---------- аватарка с морфингом формы ---------- */
  .avatar-btn {
    position: relative;
    width: 196px;
    height: 196px;
    display: grid;
    place-items: center;
    border: 0;
    background: none;
    cursor: pointer;
    margin-bottom: 18px;
    animation: rise var(--dur-slow) var(--ease-default) .05s backwards;
    touch-action: manipulation;
  }
  .avatar-bg {
    position: absolute;
    inset: -14px;
    background: var(--md-primary-container);
    border-radius: 50%;
    animation: spin 24s linear infinite;
    transition: clip-path var(--dur-slow) var(--ease-default), background-color .5s, scale var(--dur-default) var(--ease-fast);
  }
  .avatar-shape {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    transition: clip-path var(--dur-default) var(--ease-fast), scale var(--dur-fast) var(--ease-fast);
  }
  .avatar-shape img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    scale: 1.08;
  }
  .avatar-btn:hover .avatar-bg { scale: 1.06; }
  .avatar-btn:active .avatar-shape { scale: .92; }
  .avatar-btn:focus-visible { outline: none; }
  .avatar-btn:focus-visible .avatar-bg { outline: 3px solid var(--md-secondary); outline-offset: 4px; }

  .avatar-hint {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 6px 0 20px;
    color: var(--md-on-surface-variant);
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-variation-settings: 'wdth' 120;
    transition: opacity var(--dur-effects), translate var(--dur-default) var(--ease-fast);
    animation: hintbob 2.4s ease-in-out infinite;
  }
  .avatar-hint .material-symbols-rounded { font-size: 18px; color: var(--md-primary); }
  .avatar-hint.hidden { opacity: 0; translate: 0 -8px; pointer-events: none; }
  @keyframes hintbob { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }

  /* ---------- имя с вариативным шрифтом ---------- */
  h1 {
    font-size: clamp(4.5rem, 22vw, 8.5rem);
    line-height: .9;
    letter-spacing: -.03em;
    color: var(--md-primary);
    margin-bottom: 14px;
    display: flex;
    justify-content: center;
    user-select: none;
    transition: color .5s;
  }
  h1 .ch {
    display: inline-block;
    font-variation-settings: 'wght' var(--w, 760), 'wdth' var(--wd, 100), 'opsz' 144;
    transition: font-variation-settings .25s var(--ease-effects), color .4s, translate var(--dur-fast) var(--ease-fast);
    cursor: default;
    animation: letterIn var(--dur-slow) var(--ease-default) backwards;
    animation-delay: calc(var(--i) * 70ms + .15s);
  }
  h1 .ch.ready { animation: none; }
  h1 .ch.jump { animation: jump .6s var(--ease-fast); color: var(--md-tertiary); }
  @keyframes letterIn {
    from { opacity: 0; translate: 0 .4em; font-variation-settings: 'wght' 100, 'wdth' 25, 'opsz' 144; }
  }
  @keyframes jump {
    0% { translate: 0 0; }
    35% { translate: 0 -.25em; rotate: -8deg; }
    100% { translate: 0 0; rotate: 0deg; }
  }

  .tagline {
    color: var(--md-on-surface-variant);
    font-size: 1.125rem;
    line-height: 1.5;
    max-width: 480px;
    font-variation-settings: 'wdth' 105;
    margin-bottom: 4px;
    animation: rise var(--dur-slow) var(--ease-default) .35s backwards;
  }
  @keyframes rise { from { opacity: 0; translate: 0 24px; } }

  /* ---------- соцсети: button group M3 Expressive ---------- */
  .socials {
    display: flex;
    gap: 8px;
    width: min(100%, 420px);
    margin-top: 8px;
    animation: rise var(--dur-slow) var(--ease-default) .45s backwards;
  }
  .social {
    --c-bg: var(--md-primary-container);
    --c-fg: var(--md-on-primary-container);
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    height: 64px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 32px;
    background: var(--c-bg);
    color: var(--c-fg);
    text-decoration: none;
    overflow: visible;
    transition:
      flex-grow var(--dur-fast) var(--ease-fast),
      border-radius var(--dur-fast) var(--ease-fast),
      translate var(--dur-fast) var(--ease-fast),
      background-color .5s, color .5s;
  }
  .social:nth-child(3n+2) { --c-bg: var(--md-secondary-container); --c-fg: var(--md-on-secondary-container); }
  .social:nth-child(3n+3) { --c-bg: var(--md-tertiary-container); --c-fg: var(--md-on-tertiary-container); }
  .social svg { width: 26px; height: 26px; position: relative; z-index: 1; transition: scale var(--dur-fast) var(--ease-fast); }
  .social:hover { border-radius: 20px; }
  .social:hover svg { scale: 1.12; }
  .social:active { flex-grow: 1.7; border-radius: 12px; }
  .social:active svg { scale: .9; }

  /* state layer + ripple контейнер */
  .ripple-host { position: relative; overflow: hidden; isolation: isolate; }
  .social.ripple-host { overflow: hidden; }
  .ripple-host::before {
    content: "";
    position: absolute;
    inset: 0;
    background: currentColor;
    opacity: 0;
    transition: opacity var(--dur-effects);
    pointer-events: none;
    z-index: 0;
  }
  .ripple-host:hover::before { opacity: .08; }
  .ripple-host:focus-visible::before { opacity: .1; }
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: currentColor;
    opacity: .16;
    pointer-events: none;
    translate: -50% -50%;
    scale: 0;
    animation: ripple .55s var(--ease-effects) forwards;
    z-index: 0;
  }
  @keyframes ripple { to { scale: 1; opacity: 0; } }

  /* тултип */
  .tip {
    position: fixed;
    z-index: 60;
    padding: 6px 10px;
    border-radius: 8px;
    background: var(--md-inverse-surface);
    color: var(--md-inverse-on-surface);
    font-size: .8rem;
    font-weight: 500;
    pointer-events: none;
    opacity: 0;
    scale: .8;
    transition: opacity var(--dur-effects), scale var(--dur-fast) var(--ease-fast);
    white-space: nowrap;
  }
  .tip.show { opacity: 1; scale: 1; }

  /* ---------- секция пёселя ---------- */
  .dog-reveal {
    width: 100%;
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    transition: grid-template-rows .6s cubic-bezier(.2, 0, 0, 1), opacity .4s, margin-top .6s cubic-bezier(.2, 0, 0, 1);
  }
  .dog-reveal.open { grid-template-rows: 1fr; opacity: 1; margin-top: 36px; }
  .dog-inner { overflow: hidden; min-height: 0; }

  .card {
    background: var(--md-surface-container);
    border-radius: 32px;
    padding: 28px 20px 24px;
    transition: background-color .5s;
    position: relative;
  }
  .dog-reveal.open .card { animation: cardIn var(--dur-slow) var(--ease-default); }
  @keyframes cardIn { from { scale: .9; border-radius: 80px; } }

  .section-title {
    font-size: 1.75rem;
    font-weight: 700;
    font-variation-settings: 'wdth' 120, 'opsz' 40;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .section-title .material-symbols-rounded { font-size: 30px; color: var(--md-tertiary); }
  .section-sub { color: var(--md-on-surface-variant); font-size: .95rem; margin-bottom: 20px; }

  /* M3 Expressive loading indicator */
  .loader {
    width: 56px;
    height: 56px;
    margin: 32px auto;
    border-radius: 50%;
    background: var(--md-primary-container);
    display: grid;
    place-items: center;
  }
  .loader-shape {
    width: 38px;
    height: 38px;
    background: var(--md-primary);
    border-radius: 50%;
    animation: spin 1.6s linear infinite;
    transition: clip-path .55s var(--ease-fast);
  }
  .loader[hidden] { display: none; }

  .gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    width: 100%;
  }
  .gallery figure {
    position: relative;
    overflow: hidden;
    aspect-ratio: 1 / 1;
    cursor: zoom-in;
    background: var(--md-surface-container-highest);
    transition: border-radius var(--dur-default) var(--ease-fast), scale var(--dur-fast) var(--ease-fast);
    animation: popIn var(--dur-slow) var(--ease-default) backwards;
  }
  .gallery figure:nth-child(1) { border-radius: 999px 999px 28px 28px; animation-delay: 0ms; }
  .gallery figure:nth-child(2) { border-radius: 28px 96px 28px 96px; animation-delay: 70ms; }
  .gallery figure:nth-child(3) { border-radius: 96px 28px 96px 28px; animation-delay: 140ms; }
  .gallery figure:nth-child(4) { border-radius: 28px 28px 999px 999px; animation-delay: 210ms; }
  .gallery figure:hover { border-radius: 28px; }
  .gallery figure:active { scale: .95; }
  .gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: scale .6s var(--ease-default);
  }
  .gallery figure:hover img { scale: 1.08; }
  @keyframes popIn { from { opacity: 0; scale: .6; } }
  @keyframes wiggle {
    25% { rotate: -4deg; scale: 1.04; }
    60% { rotate: 3deg; }
  }

  /* шкала счастья: wavy progress */
  .happy {
    margin-top: 24px;
    padding: 18px 18px 16px;
    border-radius: 24px;
    background: var(--md-surface-container-high);
    text-align: left;
    transition: background-color .5s;
  }
  .happy-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }
  .happy-label { font-weight: 600; font-variation-settings: 'wdth' 110; }
  .happy-value {
    font-size: 1.5rem;
    font-weight: 800;
    font-variation-settings: 'wdth' 130, 'opsz' 36;
    color: var(--md-primary);
    font-variant-numeric: tabular-nums;
  }
  .wave { display: block; width: 100%; height: 20px; overflow: visible; }
  .wave .active { stroke: var(--md-primary); }
  .wave .track { stroke: var(--md-secondary-container); }
  .wave .stop { fill: var(--md-primary); }
  .happy-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .pet-count { color: var(--md-on-surface-variant); font-size: .875rem; }

  /* кнопка M3 Expressive (filled, меняет форму при нажатии) */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 56px;
    padding: 0 24px 0 20px;
    border: 0;
    border-radius: 28px;
    background: var(--md-primary);
    color: var(--md-on-primary);
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    font-variation-settings: 'wdth' 110;
    cursor: pointer;
    touch-action: manipulation;
    transition: border-radius var(--dur-fast) var(--ease-fast), scale var(--dur-fast) var(--ease-fast), background-color .5s, color .5s;
  }
  .btn > :not(.ripple) { position: relative; z-index: 1; }
  .btn:hover { border-radius: 20px; }
  .btn:active { border-radius: 12px; scale: .96; }

  /* ---------- лайтбокс ---------- */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: color-mix(in srgb, #000 62%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    touch-action: pan-y;
  }
  .lightbox.open { display: flex; animation: fade var(--dur-effects) both; }
  @keyframes fade { from { opacity: 0; } }
  .lb-img {
    max-width: min(92vw, 900px);
    max-height: 80vh;
    border-radius: 28px;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
  .icon-btn {
    width: 56px;
    height: 56px;
    border: 0;
    border-radius: 28px;
    display: grid;
    place-items: center;
    background: var(--md-secondary-container);
    color: var(--md-on-secondary-container);
    cursor: pointer;
    transition: border-radius var(--dur-fast) var(--ease-fast), scale var(--dur-fast) var(--ease-fast), background-color .5s;
  }
  .icon-btn > :not(.ripple) { position: relative; z-index: 1; }
  .icon-btn:hover { border-radius: 18px; }
  .icon-btn:active { border-radius: 12px; scale: .92; }

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const root = document.documentElement;
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    };
    const buzz = (ms = 8) => { try { navigator.vibrate?.(ms); } catch {} };
    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

    // ---------- пружины M3 Expressive как CSS linear() ----------
    function springEasing(stiffness, damping) {
      const w0 = Math.sqrt(stiffness);
      const wd = w0 * Math.sqrt(Math.max(1 - damping * damping, 1e-6));
      const x = (t) => damping < 1
        ? 1 - Math.exp(-damping * w0 * t) * (Math.cos(wd * t) + (damping * w0 / wd) * Math.sin(wd * t))
        : 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      let end = 0.05;
      for (let t = 0; t < 3; t += 0.005) if (Math.abs(1 - x(t)) > 0.002) end = t + 0.005;
      const steps = 40;
      const pts = Array.from({ length: steps + 1 }, (_, i) => +x((end * i) / steps).toFixed(4));
      pts[steps] = 1;
      return { easing: `linear(${pts.join(', ')})`, ms: Math.round(end * 1000) };
    }
    if (CSS.supports('transition-timing-function', 'linear(0, 1)')) {
      const springs = {
        fast: springEasing(800, 0.6),
        default: springEasing(380, 0.8),
        slow: springEasing(200, 0.8),
      };
      for (const [name, s] of Object.entries(springs)) {
        root.style.setProperty(`--ease-${name}`, s.easing);
        root.style.setProperty(`--dur-${name}`, s.ms + 'ms');
      }
    }

    // ---------- библиотека фигур M3 (все с одинаковым числом точек, чтобы морфились) ----------
    const N = 72;
    const SHAPES = {
      circle: () => 1,
      cookie4: (t) => 1 + 0.08 * Math.cos(4 * t),
      cookie6: (t) => 1 + 0.07 * Math.cos(6 * t),
      cookie9: (t) => 1 + 0.055 * Math.cos(9 * t),
      cookie12: (t) => 1 + 0.045 * Math.cos(12 * t),
      sunny: (t) => 1 + 0.06 * Math.cos(8 * t),
      flower: (t) => 1 + 0.14 * Math.cos(8 * t),
      clover: (t) => 1 + 0.22 * Math.cos(4 * t),
      pentagon: (t) => 1 + 0.1 * Math.cos(5 * t),
      burst: (t) => 1 + 0.1 * Math.cos(12 * t),
      squircle: (t) => Math.pow(Math.pow(Math.abs(Math.cos(t)), 4) + Math.pow(Math.abs(Math.sin(t)), 4), -1 / 4),
    };
    const SHAPE_NAMES = Object.keys(SHAPES).filter((n) => n !== 'circle');

    function shapeClip(name, rot = 0) {
      const pts = [];
      if (name === 'heart') {
        for (let i = 0; i < N; i++) {
          const t = (2 * Math.PI * i) / N;
          const x = 16 * Math.sin(t) ** 3;
          const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
          pts.push([50 + x * 3, 46 - y * 3]);
        }
      } else {
        const f = SHAPES[name];
        const rs = [];
        let max = 0;
        for (let i = 0; i < N; i++) {
          const a = -Math.PI / 2 + (2 * Math.PI * i) / N;
          const r = f(a - rot);
          rs.push([a, r]);
          max = Math.max(max, r);
        }
        for (const [a, r] of rs) pts.push([50 + (50 * r / max) * Math.cos(a), 50 + (50 * r / max) * Math.sin(a)]);
      }
      return `polygon(${pts.map(([x, y]) => `${x.toFixed(2)}% ${y.toFixed(2)}%`).join(',')})`;
    }
    function setShape(el, name, rot = 0) {
      el.style.borderRadius = '0';
      el.style.clipPath = shapeClip(name, rot);
    }

    // ---------- динамический цвет ----------
    const ROLES = {
      primary: 'primary', 'on-primary': 'onPrimary', 'primary-container': 'primaryContainer', 'on-primary-container': 'onPrimaryContainer',
      secondary: 'secondary', 'on-secondary': 'onSecondary', 'secondary-container': 'secondaryContainer', 'on-secondary-container': 'onSecondaryContainer',
      tertiary: 'tertiary', 'on-tertiary': 'onTertiary', 'tertiary-container': 'tertiaryContainer', 'on-tertiary-container': 'onTertiaryContainer',
      surface: 'surface', 'on-surface': 'onSurface', 'on-surface-variant': 'onSurfaceVariant',
      outline: 'outline', 'outline-variant': 'outlineVariant',
      'surface-container-lowest': 'surfaceContainerLowest', 'surface-container-low': 'surfaceContainerLow',
      'surface-container': 'surfaceContainer', 'surface-container-high': 'surfaceContainerHigh',
      'surface-container-highest': 'surfaceContainerHighest',
      'inverse-surface': 'inverseSurface', 'inverse-on-surface': 'inverseOnSurface', 'inverse-primary': 'inversePrimary',
    };
    let mcu = null;
    let seed = null;
    let mode = store.get('tuki-mode') || 'auto';
    const darkMq = matchMedia('(prefers-color-scheme: dark)');
    const isDark = () => mode === 'dark' || (mode === 'auto' && darkMq.matches);

    function tokensFor(seedArgb, dark) {
      const scheme = new mcu.SchemeExpressive(mcu.Hct.fromInt(seedArgb), dark, 0);
      const out = {};
      for (const [css, role] of Object.entries(ROLES)) {
        out['--md-' + css] = mcu.hexFromArgb(mcu.MaterialDynamicColors[role].getArgb(scheme));
      }
      return out;
    }
    function applyTheme({ persist = true } = {}) {
      const dark = isDark();
      root.dataset.theme = dark ? 'dark' : 'light';
      if (!mcu || seed == null) {
        // палитра ещё не посчитана — берём кэш для нужного режима
        try {
          const cached = JSON.parse(store.get('tuki-tokens') || 'null')?.[dark ? 'dark' : 'light'];
          if (cached) for (const k in cached) root.style.setProperty(k, cached[k]);
        } catch {}
        return;
      }
      const t = tokensFor(seed, dark);
      for (const k in t) root.style.setProperty(k, t[k]);
      document.querySelector('meta[name="theme-color"]').content = t['--md-surface'];
      if (persist) store.set('tuki-tokens', JSON.stringify({ light: tokensFor(seed, false), dark: tokensFor(seed, true) }));
    }
    darkMq.addEventListener('change', () => mode === 'auto' && applyTheme());

    // запасной цвет аватарки: при открытии через file:// браузер не даёт читать пиксели картинки
    const AVATAR_SEED = '#aa06da';
    async function seedFromAvatar() {
      const img = $('avatarImg');
      await img.decode().catch(() => {});
      try {
        return await mcu.sourceColorFromImage(img);
      } catch {
        return mcu.argbFromHex(AVATAR_SEED);
      }
    }

    (async () => {
      try {
        mcu = await import('https://cdn.jsdelivr.net/npm/@material/material-color-utilities@0.3.0/+esm');
        const saved = store.get('tuki-seed');
        seed = saved && saved !== 'avatar' ? mcu.argbFromHex(saved) : await seedFromAvatar();
        applyTheme();
      } catch (e) {
        // без CDN просто остаёмся на статичной палитре
        console.warn('Динамический цвет недоступен', e);
        applyTheme();
      }
    })();

    // ---------- snackbar ----------
    let snackTimer;
    function snack(text) {
      const s = $('snackbar');
      s.textContent = text;
      s.classList.add('show');
      clearTimeout(snackTimer);
      snackTimer = setTimeout(() => s.classList.remove('show'), 2600);
    }

    // ---------- ripple ----------
    document.addEventListener('pointerdown', (e) => {
      const host = e.target.closest('.ripple-host');
      if (!host || reduceMotion) return;
      const r = host.getBoundingClientRect();
      const size = Math.hypot(r.width, r.height) * 2;
      const dot = document.createElement('span');
      dot.className = 'ripple';
      dot.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left}px;top:${e.clientY - r.top}px`;
      host.appendChild(dot);
      dot.addEventListener('animationend', () => dot.remove());
    });

    // ---------- тултипы соцсетей ----------
    const tip = document.createElement('div');
    tip.className = 'tip';
    tip.setAttribute('aria-hidden', 'true');
    document.body.appendChild(tip);
    document.querySelectorAll('[data-tip]').forEach((el) => {
      const show = () => {
        tip.textContent = el.dataset.tip;
        const r = el.getBoundingClientRect();
        tip.style.left = r.left + r.width / 2 - tip.offsetWidth / 2 + 'px';
        tip.style.top = r.top - tip.offsetHeight - 10 + 'px';
        tip.classList.add('show');
      };
      const hide = () => tip.classList.remove('show');
      el.addEventListener('mouseenter', show);
      el.addEventListener('focus', show);
      el.addEventListener('mouseleave', hide);
      el.addEventListener('blur', hide);
    });

    // ---------- приветствие по времени ----------
    (() => {
      const h = new Date().getHours();
      const [icon, text] =
        h < 5 ? ['bedtime', 'Доброй ночи'] :
        h < 12 ? ['wb_sunny', 'Доброе утро'] :
        h < 18 ? ['light_mode', 'Добрый день'] :
        h < 23 ? ['wb_twilight', 'Добрый вечер'] : ['bedtime', 'Доброй ночи'];
      const chip = $('greeting');
      chip.children[0].textContent = icon;
      chip.children[1].textContent = text + '!';
    })();

    // ---------- имя: буквы реагируют на курсор ----------
    const name = $('name');
    const letters = [...name.textContent].map((c, i) => {
      const s = document.createElement('span');
      s.className = 'ch';
      s.textContent = c;
      s.style.setProperty('--i', i);
      s.setAttribute('aria-hidden', 'true');
      return s;
    });
    name.textContent = '';
    letters.forEach((s) => name.appendChild(s));
    letters.forEach((s) => {
      s.addEventListener('animationend', () => s.classList.remove('jump'));
      s.addEventListener('pointerdown', () => {
        s.classList.remove('jump');
        void s.offsetWidth;
        s.classList.add('jump');
        buzz();
      });
    });
    let lettersReady = false;
    setTimeout(() => {
      lettersReady = true;
      letters.forEach((s) => s.classList.add('ready'));
    }, 1400);
    let pointerRaf = 0;
    window.addEventListener('pointermove', (e) => {
      if (pointerRaf) return;
      pointerRaf = requestAnimationFrame(() => {
        pointerRaf = 0;
        // параллакс фоновых фигур
        root.style.setProperty('--px', (e.clientX / innerWidth - 0.5).toFixed(3));
        root.style.setProperty('--py', (e.clientY / innerHeight - 0.5).toFixed(3));
        if (!lettersReady || document.body.classList.contains('party')) return;
        for (const s of letters) {
          const r = s.getBoundingClientRect();
          const d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
          const k = Math.max(0, 1 - d / 320);
          s.style.setProperty('--w', Math.round(500 + 500 * k));
          s.style.setProperty('--wd', Math.round(85 + 66 * k));
        }
      });
    }, { passive: true });

    // ---------- фоновые фигуры ----------
    const bgShapes = [...document.querySelectorAll('.bg-shape > div')];
    bgShapes.forEach((el) => setShape(el, pick(SHAPE_NAMES), rand(0, 1)));
    if (!reduceMotion) {
      setInterval(() => setShape(pick(bgShapes), pick(SHAPE_NAMES), rand(0, 1)), 3500);
    }

    // ---------- аватарка: морфинг + раскрытие пёселя ----------
    const avatarBtn = $('avatarBtn');
    const avatarShape = $('avatarShape');
    const avatarBg = $('avatarBg');
    const AVATAR_CYCLE = ['cookie9', 'flower', 'clover', 'cookie12', 'pentagon', 'squircle', 'cookie4', 'burst', 'cookie6'];
    let avatarIdx = 0;
    setShape(avatarShape, AVATAR_CYCLE[0]);
    setShape(avatarBg, 'sunny');
    function morphAvatar(nameOverride) {
      avatarIdx = (avatarIdx + 1) % AVATAR_CYCLE.length;
      setShape(avatarShape, nameOverride || AVATAR_CYCLE[avatarIdx], rand(0, Math.PI));
      setShape(avatarBg, pick(['sunny', 'burst', 'cookie12', 'flower']), rand(0, Math.PI));
    }

    const reveal = $('dogReveal');
    const gallery = $('gallery');
    const loader = $('loader');
    let galleryLoaded = false;

    function shuffle() {
      const figs = [...gallery.children];
      for (let i = figs.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [figs[i], figs[j]] = [figs[j], figs[i]];
      }
      figs.forEach((f) => gallery.appendChild(f));
    }

    function runLoader(ms) {
      loader.hidden = false;
      const shape = $('loaderShape');
      const seq = ['cookie9', 'pentagon', 'clover', 'burst', 'squircle', 'flower', 'cookie4'];
      let i = 0;
      setShape(shape, seq[0]);
      const timer = setInterval(() => setShape(shape, seq[++i % seq.length]), 420);
      return new Promise((res) => setTimeout(() => { clearInterval(timer); loader.hidden = true; res(); }, ms));
    }

    async function toggleDog() {
      const open = reveal.classList.toggle('open');
      avatarBtn.setAttribute('aria-expanded', String(open));
      avatarBtn.setAttribute('aria-label', open ? 'Спрятать пёселя' : 'Показать пёселя');
      $('avatarHint').classList.toggle('hidden', open);
      reveal.inert = !open;
      morphAvatar();
      buzz(12);
      if (!open) return;
      shuffle();
      setTimeout(() => reveal.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 200);
      if (!galleryLoaded) {
        gallery.hidden = true;
        const imgs = [...gallery.querySelectorAll('img')];
        imgs.forEach((im) => (im.loading = 'eager'));
        await Promise.all([
          runLoader(reduceMotion ? 0 : 1100),
          ...imgs.map((im) => im.decode().catch(() => {})),
        ]);
        galleryLoaded = true;
      }
      gallery.hidden = false;
      // перезапуск входной анимации карточек
      [...gallery.children].forEach((f) => { f.style.animation = 'none'; void f.offsetWidth; f.style.animation = ''; });
      startWave();
    }
    avatarBtn.addEventListener('click', toggleDog);

    // ---------- эффекты: конфетти из фигур и эмодзи ----------
    const FX_COLORS = ['--md-primary', '--md-secondary', '--md-tertiary', '--md-primary-container', '--md-tertiary-container'];
    function burst(x, y, count = 14, power = 1) {
      if (reduceMotion) return;
      const cs = getComputedStyle(root);
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'fx';
        const size = rand(10, 24);
        el.style.cssText = `width:${size}px;height:${size}px;background:${cs.getPropertyValue(pick(FX_COLORS))}`;
        el.style.clipPath = shapeClip(pick(SHAPE_NAMES), rand(0, 3));
        document.body.appendChild(el);
        const a = rand(0, Math.PI * 2);
        const v = rand(60, 180) * power;
        const dx = Math.cos(a) * v;
        const dy = Math.sin(a) * v - 60 * power;
        const rot = rand(-360, 360);
        el.animate([
          { transform: `translate(${x - size / 2}px, ${y - size / 2}px) scale(0) rotate(0deg)`, opacity: 1 },
          { transform: `translate(${x + dx - size / 2}px, ${y + dy - size / 2}px) scale(1.15) rotate(${rot / 2}deg)`, opacity: 1, offset: 0.35 },
          { transform: `translate(${x + dx * 1.3 - size / 2}px, ${y + dy + 220 * power - size / 2}px) scale(.6) rotate(${rot}deg)`, opacity: 0 },
        ], { duration: rand(900, 1500) * Math.sqrt(power), easing: 'cubic-bezier(.2,.6,.4,1)' }).finished.then(() => el.remove());
      }
    }
    function floatEmoji(x, y, emoji) {
      if (reduceMotion) return;
      const el = document.createElement('div');
      el.className = 'fx fx-emoji';
      el.textContent = emoji;
      document.body.appendChild(el);
      const dx = rand(-50, 50);
      el.animate([
        { transform: `translate(${x - 14}px, ${y - 14}px) scale(.3)`, opacity: 0 },
        { transform: `translate(${x - 14 + dx / 3}px, ${y - 50}px) scale(1.2)`, opacity: 1, offset: 0.25 },
        { transform: `translate(${x - 14 + dx}px, ${y - 160}px) scale(.9) rotate(${dx / 2}deg)`, opacity: 0 },
      ], { duration: 1300, easing: 'cubic-bezier(.2,.7,.3,1)' }).finished.then(() => el.remove());
    }
    function rain(emojis, count = 26) {
      if (reduceMotion) return;
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'fx fx-emoji';
        el.textContent = pick(emojis);
        document.body.appendChild(el);
        const x = rand(0, innerWidth - 28);
        el.animate([
          { transform: `translate(${x}px, -40px) rotate(0deg)` },
          { transform: `translate(${x + rand(-60, 60)}px, ${innerHeight + 40}px) rotate(${rand(-200, 200)}deg)` },
        ], { duration: rand(1800, 3200), delay: rand(0, 900), easing: 'cubic-bezier(.4,0,.8,.6)', fill: 'backwards' })
          .finished.then(() => el.remove());
      }
    }

    // клик по пустому месту — салют из фигур
    document.addEventListener('click', (e) => {
      if (e.target.closest('a, button, figure, .card, .lightbox, .fab-wrap, h1')) return;
      burst(e.clientX, e.clientY, 10, 0.7);
    });

    // ---------- шкала счастья (wavy progress) ----------
    const wave = $('wave');
    const [trackPath, activePath] = wave.querySelectorAll('path');
    const stopDot = wave.querySelector('circle');
    let happy = 0, shown = 0, phase = 0, waveRaf = 0, celebrating = false;
    let pets = +(store.get('tuki-pets') || 0);
    function renderPetCount() {
      const n = pets;
      const word = n % 10 === 1 && n % 100 !== 11 ? 'раз' : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? 'раза' : 'раз';
      $('petCount').textContent = n ? `Погладили ${n} ${word}` : 'Ещё никто не гладил';
    }
    renderPetCount();

    function drawWave() {
      const W = wave.clientWidth, H = 20, mid = H / 2, amp = 3, len = 32, gap = 8;
      const end = Math.max(0, shown * W);
      let d = '';
      for (let x = 2; x <= end; x += 2) {
        const y = mid + Math.sin((x / len) * Math.PI * 2 - phase) * amp * Math.min(1, end / 40);
        d += (d ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(2);
      }
      activePath.setAttribute('d', d);
      const tStart = Math.min(W - 2, end + gap);
      trackPath.setAttribute('d', tStart < W - 4 ? `M${tStart} ${mid}L${W - 2} ${mid}` : '');
      stopDot.setAttribute('cx', W - 2);
      stopDot.setAttribute('cy', mid);
      stopDot.style.opacity = shown > 0.97 ? 0 : 1;
    }
    function waveLoop() {
      if (!reveal.classList.contains('open')) { waveRaf = 0; return; }
      shown += (happy - shown) * 0.12;
      if (!reduceMotion) phase += 0.08;
      if (!celebrating && happy > 0) happy = Math.max(0, happy - 0.0006); // пёсель потихоньку скучает
      $('happyValue').textContent = Math.round(shown * 100) + '%';
      wave.setAttribute('aria-valuenow', Math.round(happy * 100));
      drawWave();
      waveRaf = requestAnimationFrame(waveLoop);
    }
    function startWave() { if (!waveRaf) waveRaf = requestAnimationFrame(waveLoop); }

    function pet(x, y) {
      pets++;
      store.set('tuki-pets', pets);
      renderPetCount();
      buzz(10);
      floatEmoji(x, y, pick(['💖', '🐾', '✨', '💜', '🦴']));
      const fig = pick([...gallery.children]);
      if (!reduceMotion) fig.animate([{ rotate: '0deg' }, { rotate: '-5deg', scale: 1.05 }, { rotate: '4deg' }, { rotate: '0deg' }], { duration: 500, easing: 'ease-out' });
      if (celebrating) return;
      happy = Math.min(1, happy + rand(0.08, 0.15));
      if (happy >= 1) celebrate();
    }
    function celebrate() {
      celebrating = true;
      burst(innerWidth / 2, innerHeight / 2, 40, 1.8);
      morphAvatar('heart');
      snack('Пёсель счастлив на 100%! 💖');
      buzz([20, 40, 20]);
      setTimeout(() => {
        celebrating = false;
        happy = 0.35;
        morphAvatar();
      }, 3200);
    }
    $('petBtn').addEventListener('click', (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      pet(e.clientX || r.left + r.width / 2, e.clientY || r.top);
    });
    new ResizeObserver(drawWave).observe(wave);

    // ---------- лайтбокс ----------
    const lb = $('lightbox'), lbImg = $('lbImg');
    let lbIndex = 0, lastFocus = null;
    const imgsInOrder = () => [...gallery.querySelectorAll('img')];
    function showLb(i, dir = 0) {
      const imgs = imgsInOrder();
      lbIndex = (i + imgs.length) % imgs.length;
      lbImg.src = imgs[lbIndex].src;
      lbImg.alt = imgs[lbIndex].alt;
      $('lbCounter').textContent = `${lbIndex + 1}/${imgs.length}`;
      if (!reduceMotion) {
        lbImg.animate(
          dir
            ? [{ transform: `translateX(${dir * 60}px) scale(.92)`, opacity: 0, borderRadius: '120px' }, { transform: 'none', opacity: 1, borderRadius: '28px' }]
            : [{ transform: 'scale(.6)', opacity: 0, borderRadius: '50%' }, { transform: 'none', opacity: 1, borderRadius: '28px' }],
          { duration: 600, easing: getComputedStyle(root).getPropertyValue('--ease-default').trim() || 'ease-out' }
        );
      }
    }
    function openLb(i) {
      lastFocus = document.activeElement;
      lb.classList.add('open');
      showLb(i);
      $('lbClose').focus();
      document.body.style.overflow = 'hidden';
    }
    function closeLb() {
      if (!lb.classList.contains('open')) return;
      lb.classList.remove('open');
      lbImg.src = '';
      document.body.style.overflow = '';
      lastFocus?.focus();
    }
    gallery.addEventListener('click', (e) => {
      const fig = e.target.closest('figure');
      if (!fig) return;
      if (e.detail > 1) return; // двойной клик — это поглаживание
      clearTimeout(gallery._t);
      gallery._t = setTimeout(() => openLb(imgsInOrder().indexOf(fig.querySelector('img'))), 260);
    });
    gallery.addEventListener('dblclick', (e) => {
      clearTimeout(gallery._t);
      if (e.target.closest('figure')) pet(e.clientX, e.clientY);
    });
    lbImg.addEventListener('dblclick', (e) => pet(e.clientX, e.clientY));
    $('lbClose').addEventListener('click', closeLb);
    $('lbPrev').addEventListener('click', () => showLb(lbIndex - 1, -1));
    $('lbNext').addEventListener('click', () => showLb(lbIndex + 1, 1));
    lb.addEventListener('click', (e) => { if (e.target === lb) closeLb(); });
    let swipeX = null;
    lb.addEventListener('pointerdown', (e) => (swipeX = e.clientX));
    lb.addEventListener('pointerup', (e) => {
      if (swipeX == null) return;
      const dx = e.clientX - swipeX;
      swipeX = null;
      if (Math.abs(dx) > 60) showLb(lbIndex + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
    });

    // ---------- FAB menu ----------
    const fab = $('fab'), fabMenu = $('fabMenu');
    const MODE_UI = { auto: ['contrast', 'Тема: авто'], light: ['light_mode', 'Тема: светлая'], dark: ['dark_mode', 'Тема: тёмная'] };
    function renderMode() {
      $('modeIcon').textContent = MODE_UI[mode][0];
      $('modeLabel').textContent = MODE_UI[mode][1];
    }
    renderMode();
    function setMenu(open) {
      fab.setAttribute('aria-expanded', String(open));
      $('fabIcon').textContent = open ? 'close' : 'palette';
      fabMenu.hidden = !open;
      if (open) fabMenu.querySelector('button').focus({ preventScroll: true });
    }
    fab.addEventListener('click', () => { setMenu(fab.getAttribute('aria-expanded') !== 'true'); buzz(); });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#fabWrap') && fab.getAttribute('aria-expanded') === 'true') setMenu(false);
    });

    let partyTimer = 0, partyHue = 0;
    function setParty(on) {
      document.body.classList.toggle('party', on);
      fabMenu.querySelector('[data-act="party"]').classList.toggle('on', on);
      clearInterval(partyTimer);
      if (on) {
        if (mcu) {
          partyHue = mcu.Hct.fromInt(seed ?? 0xff6750a4).hue;
          partyTimer = setInterval(() => {
            partyHue = (partyHue + 7) % 360;
            seed = mcu.Hct.from(partyHue, 70, 60).toInt();
            applyTheme({ persist: false });
          }, 160);
        }
        rain(['🎉', '🐾', '✨', '🎈', '💜']);
        snack('Вечеринка! 🎉');
      } else {
        const saved = store.get('tuki-seed');
        (saved && saved !== 'avatar' && mcu ? Promise.resolve(mcu.argbFromHex(saved)) : mcu ? seedFromAvatar() : Promise.resolve(null))
          .then((s) => { seed = s; applyTheme(); });
        snack('Вечеринка окончена');
      }
    }

    fabMenu.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      buzz();
      const r = btn.getBoundingClientRect();
      switch (btn.dataset.act) {
        case 'mode':
          mode = { auto: 'light', light: 'dark', dark: 'auto' }[mode];
          store.set('tuki-mode', mode);
          renderMode();
          applyTheme();
          break;
        case 'random':
          if (!mcu) return snack('Палитра ещё грузится…');
          if (document.body.classList.contains('party')) setParty(false);
          seed = mcu.Hct.from(rand(0, 360), rand(40, 90), 55).toInt();
          store.set('tuki-seed', mcu.hexFromArgb(seed));
          applyTheme();
          burst(r.left + 30, r.top + 28, 12);
          break;
        case 'avatar':
          if (!mcu) return snack('Палитра ещё грузится…');
          if (document.body.classList.contains('party')) setParty(false);
          store.set('tuki-seed', 'avatar');
          seed = await seedFromAvatar();
          applyTheme();
          snack('Цвета взяты из аватарки ✨');
          break;
        case 'party':
          setParty(!document.body.classList.contains('party'));
          break;
      }
    });

    // ---------- клавиатура и пасхалки ----------
    const KONAMI = 'ArrowUp ArrowUp ArrowDown ArrowDown ArrowLeft ArrowRight ArrowLeft ArrowRight b a';
    let keys = [], typed = '';
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (lb.classList.contains('open')) closeLb();
        else if (fab.getAttribute('aria-expanded') === 'true') { setMenu(false); fab.focus(); }
      }
      if (lb.classList.contains('open')) {
        if (e.key === 'ArrowLeft') showLb(lbIndex - 1, -1);
        if (e.key === 'ArrowRight') showLb(lbIndex + 1, 1);
        if (e.key === 'Tab') {
          // держим фокус внутри лайтбокса
          const f = [...lb.querySelectorAll('button')];
          const i = f.indexOf(document.activeElement);
          e.preventDefault();
          f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
        }
      }
      keys = [...keys, e.key].slice(-10);
      if (keys.join(' ').toLowerCase() === KONAMI.toLowerCase()) setParty(!document.body.classList.contains('party'));
      if (e.key.length === 1) {
        typed = (typed + e.key.toLowerCase()).slice(-8);
        if (typed.endsWith('гав') || typed.endsWith('woof')) {
          typed = '';
          rain(['🐾', '🐕', '🦴', '🐶']);
          snack('Гав-гав! 🐕');
        }
      }
    });

    // пёсель скучает, когда уходишь со вкладки
    const baseTitle = document.title;
    document.addEventListener('visibilitychange', () => {
      document.title = document.hidden ? 'Пёсель скучает 🥺' : baseTitle;
    });
  </script>
</body>
</html>
